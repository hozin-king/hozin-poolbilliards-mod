name: Build Mod Pool Billiards

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.sh'
      - 'apply_patches.py'
      - 'verify.py'
      - 'mod-src/**'
      - 'tests/**'
      - 'original/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install platform + build-tools 34 (SDK bawaan runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: Unduh apktool 2.10.0
        run: |
          curl -sL -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar apktool.jar --version

      - name: Uji konsistensi klon fisika + logika autoplay (JVM)
        run: |
          mkdir -p /tmp/simtest
          javac -encoding UTF-8 -proc:none -d /tmp/simtest \
            mod-src/com/hozin/poolmod/Sim.java \
            mod-src/com/hozin/poolmod/Snap.java \
            mod-src/com/hozin/poolmod/ModState.java \
            mod-src/com/hozin/poolmod/Ref.java \
            mod-src/com/hozin/poolmod/Auto.java \
            mod-src/com/hozin/poolmod/Objective.java \
            tests/TestSim.java tests/TestAuto.java
          java -cp /tmp/simtest com.hozin.poolmod.TestSim
          java -cp /tmp/simtest com.hozin.poolmod.TestAuto

      - name: Build APK mod (gabung)
        env:
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: bash build.sh

      - name: Verifikasi APK final
        env:
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: python3 verify.py PoolBilliardsPro-Mod-v1.3.apk "original/Pool_Billiards_Pro_5.3.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poolbilliards-mod-apk
          path: PoolBilliardsPro-Mod-v1.3.apk

      - name: Buat GitHub Release (hanya tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Pool Billiards Pro Mod ${{ github.ref_name }}
          body: |
            Mod Pool Billiards Pro 5.3 (versionCode 53, com.forthblue.pool) —
            mod DIGABUNG ke dalam APK game (tanpa root, tanpa injector
            terpisah), dibangun GitHub Actions dari sumber di repo ini,
            lolos uji konsistensi klon fisika (JVM) dan verify.py.

            Baru di v1.3 (perintah user 22 Okt 21:23-21:34 + audit Arcade):

            1. EKSEKUSI TERANIMASI, bukan teleport: stik ASLI game
               digerakkan lewat state bidiknya sendiri - spin ditulis
               dulu ke state kontrol spin game (titik merah berpindah),
               stik berputar halus ke sudut terpilih, tertarik mundur
               sebanding kekuatan (jarak stik memang fungsi aimStrength
               di kode game), menghentak, lalu jalur resmi
               GameScene.shoot() memanggil PoolTable.click() tepat
               satu kali dengan nilai state tersebut. Sesudah tembakan:
               tunggu meja berhenti + jeda natural.
            2. AUTO PLAY = saklar ON/OFF: berantai tiap giliran sampai
               dimatikan / permainan selesai. Pengaman: 3x gagal
               merencanakan berturut-turut -> saklar mati sendiri +
               alasan tertulis di readout. Di PvP saklar tidak bisa ON.
            3. PENEMPATAN FREE BALL OTOMATIS: posisi dipilih dari
               kualitas tembakan terbaiknya (validasi rule.canPut
               game), bola DIGESER teranimasi ke titik terpilih lalu
               dikonfirmasi lewat putFreeball() game; fallback
               penempatan pengaman bila tak ada tembakan legal.
            4. PERENCANA EXPERT - tangga keputusan (tidak menyerah
               selama ada suapan legal): Pot -> Bank -> Kick/rail-first
               -> Combination -> Safety expert (bola putih bersembunyi)
               -> Breakout cluster -> Upaya paling tidak buruk. Aturan
               keras diperluas ke SIMULASI PENUH: bola non-target masuk
               dari jalur mana pun (pantulan/tabtrakan sekunder) =
               kandidat dibuang; bola 8 dini & scratch dibuang; penalti
               bila bola lawan berakhir dekat mulut lubang. Pot dinilai
               juga dari posisi lanjutan 2 langkah (position play)
               sebagai penentu sekunder.
            5. TINGKAT KESULITAN: NORMAL (pot langsung + safety
               sederhana, sampling kasar, tanpa kesalahan buatan) /
               EXPERT (bawaan; tangga penuh + 2 langkah) / MUSTAHIL
               (pencarian sangat rapat + PERENCANAAN RUN-OUT: urutan
               menghabiskan semua bola grup + bola 8 direncanakan
               sebagai rantai, dieksekusi langkah demi langkah dengan
               perencanaan ulang; anggaran berpikir maks ~3 detik).
               Aturan keras legalitas sama di semua tingkat.
            6. MODE ARCADE (LevelRule): objektif diganti total - semua
               bola target sah (multi-pot = keuntungan combo),
               mata uang restTime dibaca hidup ("sisa stik N" di
               readout), LUBANG HITAM (effect_type 1) terlarang di
               semua tingkat, lubang +cue/-bola bernilai bonus,
               safety diganti setup/breakout. Fungsi objektif
               per-mode kini titik sisip terpisah di perencana.

            Warisan v1.2 tetap: perbaikan garis prediksi hilang
            (container ter-reset game dipasang ulang tiap tick),
            readout keputusan lengkap (tingkat tangga + tingkat
            kesulitan + kandidat/ditolak per sebab + alasan).

            BATAS KERAS tidak berubah: semua fitur mati total di mode
            PvP online (rule.isPVPMode()) - gerbang diperiksa ulang
            tepat sebelum tembakan dieksekusi. Hanya mode offline.

            Catatan kejujuran teknis: rantai run-out panjang &
            tembakan multi-pantulan ekstrem paling peka terhadap
            selisih float klon-vs-native; yang diklaim adalah
            parameter dihitung eksak dari simulasi, bukan kepastian
            bola masuk. Uji JVM di CI: 17 skenario TestAuto + TestSim
            (termasuk posisi terjepit screenshot user, jebakan bola
            salah sekunder, Normal-vs-Mustahil, 3 skenario Arcade)
            + harness siklus animasi ujung-ke-ujung.

          files: PoolBilliardsPro-Mod-v1.3.apk
