name: Build Mod Pool Billiards

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build.sh'
      - 'apply_patches.py'
      - 'verify.py'
      - 'mod-src/**'
      - 'tests/**'
      - 'mod-assets/**'
      - 'tools_make_atlas.py'
      - 'tools_make_atlas_v150.py'
      - 'original/**'
      - '.github/workflows/build.yml'
  tags:
    - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install platform + build-tools 34 (SDK bawaan runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: Unduh apktool 2.10.0
        run: |
          curl -sL -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar apktool.jar --version

      - name: Uji konsistensi klon fisika + logika autoplay (JVM)
        run: |
          mkdir -p /tmp/simtest
          javac -encoding UTF-8 -proc:none -d /tmp/simtest \
            mod-src/com/hozin/poolmod/Sim.java \
            mod-src/com/hozin/poolmod/Snap.java \
            mod-src/com/hozin/poolmod/ModState.java \
            mod-src/com/hozin/poolmod/Ref.java \
            mod-src/com/hozin/poolmod/Auto.java \
            mod-src/com/hozin/poolmod/Objective.java \
            mod-src/com/hozin/poolmod/AutoTrigger.java \
            mod-src/com/hozin/poolmod/Magnet.java \
            mod-src/com/hozin/poolmod/Features.java \
            tests/TestSim.java tests/TestAuto.java tests/TestTrigger.java \
            tests/TestAntiScratch.java tests/TestMagnet.java \
            tests/TestPrank.java tests/TestBreak.java \
            tests/GenLevels.java tests/TestLevels.java
          java -cp /tmp/simtest com.hozin.poolmod.TestSim
          java -cp /tmp/simtest com.hozin.poolmod.TestAuto
          java -cp /tmp/simtest com.hozin.poolmod.TestTrigger
          java -cp /tmp/simtest com.hozin.poolmod.TestAntiScratch
          java -cp /tmp/simtest com.hozin.poolmod.TestMagnet
          java -cp /tmp/simtest com.hozin.poolmod.TestPrank
          java -cp /tmp/simtest com.hozin.poolmod.TestBreak
          java -cp /tmp/simtest com.hozin.poolmod.TestLevels mod-assets/data

      - name: Siapkan keystore (Secrets atau debug sementara)
        env:
          POOL_KEYSTORE_BASE64: ${{ secrets.POOL_KEYSTORE_BASE64 }}
          POOL_STORE_PASS: ${{ secrets.POOL_STORE_PASS }}
          POOL_KEY_ALIAS: ${{ secrets.POOL_KEY_ALIAS }}
          POOL_KEY_PASS: ${{ secrets.POOL_KEY_PASS }}
        run: |
          if [ -n "$POOL_KEYSTORE_BASE64" ]; then
            echo "$POOL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mod.keystore"
            echo "POOL_KEYSTORE=$RUNNER_TEMP/mod.keystore" >> "$GITHUB_ENV"
            echo "POOL_STORE_PASS=$POOL_STORE_PASS" >> "$GITHUB_ENV"
            echo "POOL_KEY_ALIAS=$POOL_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "POOL_KEY_PASS=$POOL_KEY_PASS" >> "$GITHUB_ENV"
            echo "Using provided keystore from secrets"
          else
            echo "No secrets — generating temporary debug keystore"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/mod.keystore" \
              -alias modkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug, OU=CI, O=Hozin, L=Local, S=Local, C=ID"
            echo "POOL_KEYSTORE=$RUNNER_TEMP/mod.keystore" >> "$GITHUB_ENV"
            echo "POOL_STORE_PASS=android" >> "$GITHUB_ENV"
            echo "POOL_KEY_ALIAS=modkey" >> "$GITHUB_ENV"
            echo "POOL_KEY_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Build APK mod (gabung)
        env:
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: bash build.sh

      - name: Verifikasi APK final
        env:
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: python3 verify.py PoolBilliardsPro-Mod-v1.5.0.apk "original/Pool_Billiards_Pro_5.3.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poolbilliards-mod-apk
          path: PoolBilliardsPro-Mod-v1.5.0.apk

      - name: Buat GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0-${{ github.run_number }}
          name: Pool Billiards Pro Mod v1.5.0-${{ github.run_number }}
          body: |
            Mod Pool Billiards Pro 5.3 (versionCode 53, com.forthblue.pool) —
            mod gabung satu APK, tanpa root, tanda tangan sama dengan
            rilis mod sebelumnya (bisa timpa).

            Semua fitur mod MATI TOTAL di mode PvP online
            (gerbang satu jalur: isPVPMode() sekali per tick di Hooks,
            latch fail-closed); hanya mode offline
            (VS Computer, Time, Arcade, Tutorial).

            Auto-build dari commit ${{ github.sha }} pada branch main.
          files: PoolBilliardsPro-Mod-v1.5.0.apk
          generate_release_notes: true
