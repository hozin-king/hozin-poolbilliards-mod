name: Build Mod Pool Billiards

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.sh'
      - 'apply_patches.py'
      - 'verify.py'
      - 'mod-src/**'
      - 'tests/**'
      - 'original/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install platform + build-tools 34 (SDK bawaan runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: Unduh apktool 2.10.0
        run: |
          curl -sL -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar apktool.jar --version

      - name: Uji konsistensi klon fisika + logika autoplay (JVM)
        run: |
          mkdir -p /tmp/simtest
          javac -encoding UTF-8 -proc:none -d /tmp/simtest \
            mod-src/com/hozin/poolmod/Sim.java \
            mod-src/com/hozin/poolmod/Snap.java \
            mod-src/com/hozin/poolmod/ModState.java \
            mod-src/com/hozin/poolmod/Ref.java \
            mod-src/com/hozin/poolmod/Auto.java \
            tests/TestSim.java tests/TestAuto.java
          java -cp /tmp/simtest com.hozin.poolmod.TestSim
          java -cp /tmp/simtest com.hozin.poolmod.TestAuto

      - name: Build APK mod (gabung)
        env:
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: bash build.sh

      - name: Verifikasi APK final
        env:
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: python3 verify.py PoolBilliardsPro-Mod-v1.2.apk "original/Pool_Billiards_Pro_5.3.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poolbilliards-mod-apk
          path: PoolBilliardsPro-Mod-v1.2.apk

      - name: Buat GitHub Release (hanya tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Pool Billiards Pro Mod ${{ github.ref_name }}
          body: |
            Mod Pool Billiards Pro 5.3 (versionCode 53, com.forthblue.pool) —
            mod DIGABUNG ke dalam APK game (tanpa root, tanpa injector
            terpisah), dibangun GitHub Actions dari sumber di repo ini,
            lolos uji konsistensi klon fisika (JVM) dan verify.py.

            Perbaikan v1.2 (dari kegagalan uji HP v1.1):
            1. GARIS PREDIKSI HILANG — akar terbukti dari kode game:
               setiap pergantian game/ronde, game membangun ulang
               anak-anak PoolTable (GameScene.setRule/showGameEnd ->
               PoolTable.reset() -> ContainerBase.clear()). Container
               garis mod ikut terhapus dari instance meja yang sama,
               dan pemeriksaan lama hanya berjalan saat instance meja
               berganti — garis mati permanen tanpa gejala lain.
               Sekarang kehadiran container diverifikasi & dipasang
               ulang pada SETIAP tick bidik dan setiap panggilan gambar.
            2. AUTO PLAY terasa "tolol" — logika v1.1 terbukti benar
               pada harness JVM berkode game asli (target legal, pot
               bersih, tanpa scratch), tetapi pemilihannya didominasi
               uji perturbasi sehingga tembakan jauh bisa mengalahkan
               pot dekat yang paling enak, dan kekuatan selalu besar.
               v1.2: ketahanan menjadi syarat (robust >= 3 bila ada),
               skor kemudahan (potong kecil, jarak pendek, kekuatan
               kecil) yang memutuskan, plus pelunakan kekuatan
               pasca-pilih (turun bertahap selama tetap kokoh).
            3. READOUT KEPUTUSAN di menu: grup legal terdeteksi,
               jumlah kandidat, penolakan per alasan (scratch/kontak/
               bola lawan/bola 8 dini), bola + lubang + kekuatan yang
               dipilih atau alasan tidak menembak; baris diagnosis
               prediksi (berapa segmen tergambar / kenapa tidak).

            Fitur lain tetap: target legal dari PoolRule
            .isAvailableTarget, saringan keras anti-scratch/anti-bola
            -lawan, saklar "Auto Play Otomatis", long line
            (calcAimTarget asli), menu melayang MOD.

            BATAS KERAS: semua fitur mati total di mode PvP online
            (rule.isPVPMode()) — latch + pemeriksaan di setiap titik
            masuk fitur, menu disembunyikan. Hanya untuk mode offline:
            VS Computer, Time, Arcade/Level, Tutorial. IAP/koin/stik
            dan jaringan tidak disentuh.

            Catatan: logika lolos uji skenario JVM di CI (termasuk
            layout screenshot uji HP 20:08 dan uji pulih-sesudah-reset
            pada harness lokal berkode Basket asli); perilaku runtime
            persis di perangkat adalah tahap uji di HP.
          files: PoolBilliardsPro-Mod-v1.2.apk
